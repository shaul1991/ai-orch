version: "1.0.0"
title: "SDD Self Review and PR Draft"
description: "Perform self-review and prepare PR draft, then return control to human."

parameters:
  - key: feature
    input_type: string
    requirement: required
    description: "Feature directory name under docs/specs"

instructions: |
  You are working under Human-Governed SDD.

  Project defaults:
  - Use Korean as the primary language for review notes and summaries.
  - Claude Code is the default agent for code self-review.
  - Codex may be used for PR description polishing when the user asks.
  - The user may override the provider/model per task.

  Read:
  - docs/ai-governance.md
  - docs/project-settings.md
  - AGENTS.md
  - docs/specs/{{ feature }}/requirements.md
  - docs/specs/{{ feature }}/acceptance-criteria.md
  - docs/specs/{{ feature }}/technical-plan.md
  - docs/specs/{{ feature }}/tasks.md
  - docs/specs/{{ feature }}/test-plan.md

  Rules:
  - Do not merge.
  - Do not deploy.
  - Do not resolve human review comments.
  - PR draft is the final AI step.

  Tasks:
  1. Review changed files.
  2. Compare implementation against requirements.md.
  3. Compare tests against acceptance-criteria.md.
  4. Write docs/specs/{{ feature }}/self-review.md.
  5. Prepare PR description draft.
  6. If GitHub CLI is available, create draft PR only.
  7. Stop and return control to human.

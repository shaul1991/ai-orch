version: "1.0.0"
title: "SDD Implementation"
description: "Implement approved SDD tasks only."

parameters:
  - key: feature
    input_type: string
    requirement: required
    description: "Feature directory name under docs/specs"

prompt: |
  You are working under Human-Governed SDD.

  Project defaults:
  - Use Korean as the primary language for notes and summaries.
  - Claude Code is the default agent for coding, refactoring, tests, and code self-review.
  - The user may override the provider/model per task.

  First run:
  scripts/check-sdd-docs.sh {{ feature }}

  Read:
  - .specify/memory/constitution.md
  - docs/ai-governance.md
  - docs/project-settings.md
  - AGENTS.md
  - docs/specs/{{ feature }}/spec.md
  - docs/specs/{{ feature }}/requirements.md
  - docs/specs/{{ feature }}/acceptance-criteria.md
  - docs/specs/{{ feature }}/clarifications.md
  - docs/specs/{{ feature }}/technical-plan.md
  - docs/specs/{{ feature }}/plan.md
  - docs/specs/{{ feature }}/research.md
  - docs/specs/{{ feature }}/data-model.md
  - docs/specs/{{ feature }}/contracts/
  - docs/specs/{{ feature }}/quickstart.md
  - docs/specs/{{ feature }}/tasks.md
  - docs/specs/{{ feature }}/test-plan.md
  - docs/specs/{{ feature }}/traceability.md
  - docs/specs/{{ feature }}/analysis.md
  - docs/specs/{{ feature }}/checklist.md

  Rules:
  - Implement only tasks listed in tasks.md.
  - Do not add features outside approved scope.
  - Do not change business policy.
  - Do not implement while [NEEDS CLARIFICATION] remains.
  - Keep implementation aligned with traceability.md.
  - Do not merge.
  - Do not deploy.
  - If ambiguity appears, stop and write HUMAN_DECISION_REQUIRED.

  Tasks:
  1. Inspect related code.
  2. Implement approved tasks.
  3. Add or update tests.
  4. Run scripts/run-tests.sh.
  5. Record test result notes.
  6. Stop.

version: "1.0.0"
title: "SDD Technical Planning"
description: "Create technical plan, tasks, and test plan from human-approved requirements."

parameters:
  - key: feature
    input_type: string
    requirement: required
    description: "Feature directory name under docs/specs"

instructions: |
  You are working under Human-Governed SDD.

  Project defaults:
  - Use Korean as the primary language.
  - Claude Code is the default agent for architecture design and implementation planning.
  - The user may override the provider/model per task.

  Read:
  - docs/ai-governance.md
  - docs/project-settings.md
  - AGENTS.md
  - docs/specs/{{ feature }}/requirements.md
  - docs/specs/{{ feature }}/acceptance-criteria.md

  Rules:
  - Human owns domain and business decisions.
  - AI must not decide missing business rules.
  - If domain ambiguity exists, stop and write HUMAN_DECISION_REQUIRED.
  - Do not edit source code in this phase.

  Tasks:
  1. Analyze the repository structure.
  2. Identify files or modules that would be relevant to this feature.
  3. Write docs/specs/{{ feature }}/technical-plan.md.
  4. Write docs/specs/{{ feature }}/tasks.md.
  5. Write docs/specs/{{ feature }}/test-plan.md.
  6. Stop and wait for human review.
